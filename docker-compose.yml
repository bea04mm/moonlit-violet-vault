# ============================================================
# Moonlit Violet Vault — Docker Compose
# ============================================================
# Development usage:
#   docker compose up frontend          # Start Next.js dev server
#   docker compose --profile pipeline run pipeline goodreads --file /data/library.csv
#   docker compose --profile pipeline run pipeline ocr --image /data/screenshot.jpg --type movie

services:
  # ── Next.js frontend (development mode with hot reload) ──
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: deps                    # Use deps stage for dev (has node_modules)
    volumes:
      - .:/app                        # Bind-mount source for hot reload
      - /app/node_modules             # Anonymous volume to preserve container node_modules
      - /app/.next                    # Anonymous volume for .next build cache
    ports:
      - "3000:3000"
    command: npm run dev
    env_file: .env
    environment:
      - NODE_ENV=development
    restart: unless-stopped

  # ── Python data pipeline (run-once, CLI mode) ──
  pipeline:
    build:
      context: .
      dockerfile: docker/pipeline.Dockerfile
    volumes:
      - ./data_pipeline:/pipeline     # Mount source for live edits
      - ./data:/data                  # Mount local CSVs and screenshots here
    env_file: .env
    profiles:
      - pipeline                      # Only starts when --profile pipeline is passed
